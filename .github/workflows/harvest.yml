name: MTMT harvest + GitHub Pages

on:
  workflow_dispatch:
    inputs:
      round:
        description: "Hányadik folytatás (automatikusan nő, kézzel hagyd 1-en)"
        default: "1"
  schedule:
    - cron: "0 3 * * 1"   # hétfő 03:00 UTC – heti frissítés
  push:
    branches: [main]
    paths: ["index.html", "harvest_mtmt.py", ".github/workflows/harvest.yml"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write          # a félbemaradt letöltés automatikus folytatásához

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.harvest.outputs.done }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: MTMT rekord-cache visszatöltése
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: mtmt-cache-${{ github.run_id }}
          restore-keys: mtmt-cache-
      - name: Letöltés és számítás
        id: harvest
        # A script 4 ó 40 perc után magától leáll (a GitHub 6 órás korlátja előtt), hogy a
        # már letöltött rekordok biztosan elmentődjenek; a következő kör onnan folytatja.
        timeout-minutes: 300
        env:
          INSTITUTE: ${{ vars.MTMT_INSTITUTE_ID || 'auto' }}
          REF_YEAR: ${{ vars.REF_YEAR || '' }}
        run: |
          ARGS="--institute $INSTITUTE --workers 5 --out data/szaok_data.json"
          if [ -f data/szaok_author_ids.txt ]; then ARGS="--authors data/szaok_author_ids.txt --workers 5 --out data/szaok_data.json"; fi
          if [ -n "$REF_YEAR" ]; then ARGS="$ARGS --ref-year $REF_YEAR"; fi
          set +e
          timeout -k 60s 280m python -u harvest_mtmt.py $ARGS
          rc=$?
          set -e
          if [ -f szaok_author_ids.txt ]; then mv szaok_author_ids.txt data/szaok_author_ids_felderitett.txt; fi
          if [ $rc -eq 124 ] || [ $rc -eq 137 ]; then
            echo "Időkorlát: a letöltés a következő körben folytatódik."
            echo "done=false" >> "$GITHUB_OUTPUT"
          elif [ $rc -ne 0 ]; then
            exit $rc
          else
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rekord-cache mentése (félbeszakadás esetén is)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: mtmt-cache-${{ github.run_id }}
      - name: Folytatás automatikus indítása, ha nem készült el
        if: steps.harvest.outputs.done == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ROUND: ${{ inputs.round || '1' }}
        run: |
          if [ "$ROUND" -lt 8 ]; then
            echo "Nem készült el, folytatás indítása (kör: $((ROUND + 1)))"
            gh workflow run harvest.yml --repo "$GITHUB_REPOSITORY" --ref main -f round=$((ROUND + 1))
          else
            echo "8 kör után sem készült el – kézi ellenőrzés szükséges."
          fi
      - name: Adat commitolása
        if: steps.harvest.outputs.done == 'true'
        run: |
          git config user.name "szaok-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "MTMT adatfrissítés $(date -u +%F)"
          git push
      - name: Pages csomag
        if: steps.harvest.outputs.done == 'true'
        run: mkdir -p _site && cp index.html _site/ && cp -r data _site/
      - uses: actions/upload-pages-artifact@v3
        if: steps.harvest.outputs.done == 'true'
        with:
          path: _site
  deploy:
    needs: harvest
    if: needs.harvest.outputs.done == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
